<html>

<head>
    <meta charset="utf-8">
    <title>MINESWEEPER</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="./js/main.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="game">
        
        <div class="canvas-wrapper">
            <canvas id="myCanvas" width="600" height="600" style="background-color: rgb(212, 212, 212);">
                Your browser does not support the HTML canvas element.
            </canvas>
            
            <button class="overlay-btn" id="btn-start">START!</button>
            <button class="overlay-btn hidden" id="btn-easy">EASY</button>
            <button class="overlay-btn hidden" id="btn-medium">MEDIUM</button>
            <button class="overlay-btn hidden" id="btn-hard">HARD</button>
            <button class="overlay-btn hidden" id="btn-plyagn">Play Again?</button>
            <button class="overlay-btn hidden" id="btn-mainmenu">Main Menu</button>
            <p class="tile hidden" id="info">Hover Over a Difficulty!</p>
            
        </div>

        <div class="gameElements hidden" id="gameStuff">
            <button id="flag">Flag</button>
            
            <h1>Rounds Won: <div id="rounds">0</div>
            </h1>
            <h1>Number of Bombs: <div id="bombs"></div>
            </h1>
            <button class="overlay-btn hidden" id="btn-mainmenu2">Main Menu</button>
            <!-- Put into Help Menu as a full reset of the game -->
            <!-- <button class="btn" id="reset">Reset Game</button> -->
            
        </div>

    </div>



</body>

</html>
